name: Deploy

on:
  pull_request:
    branches: [main, production]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pipeline state
        uses: actions/checkout@v4
        with:
          ref: pipeline-state
          path: pipeline-state
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Prepare verified preview snapshot
        run: node scripts/prepare-preview-data.mjs --source=pipeline-state/data --output=public/data
      - name: Check preview code and build the retained cohort
        run: |
          npm test
          npm run build -- --preview-snapshot
      - name: Run Python regressions
        run: python3 -m unittest discover -s tests -p test_crime_weekly_parser.py
      - name: Audit preview data
        run: |
          npm run check:network-contract
          npm run audit:source-freshness
          npm run audit:coverage
          npm run audit:source-health
          npm run audit:summary
          npm run audit:source-provenance
          npm run audit:network-quality
          npm run audit:data-size -- --max-mb=24
      - name: Validate operating-state contract
        run: npm run ops:validate
      - name: Verify operating-state documentation
        run: npm run ops:verify-docs
      - name: Validate approved production code manifest
        run: node scripts/approved-code.mjs
      - name: Upload checked preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          retention-days: 1
          if-no-files-found: error

  check:
    needs: build-preview
    if: ${{ always() }}
    outputs:
      preview_url: ${{ steps.deploy.outputs.deployment-url }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require validated build
        env:
          BUILD_RESULT: ${{ needs['build-preview'].result }}
        run: test "$BUILD_RESULT" = "success"
      - name: Download checked preview artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Deploy Preview
        if: ${{ !github.event.pull_request.draft }}
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "03d40efd3c60181edea80af8d927ddc1"
          command: pages deploy dist --project-name taiwan-intel-dashboard --branch pr-${{ github.event.number }}
      - name: Verify Preview
        if: ${{ !github.event.pull_request.draft }}
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$PREVIEW_URL"
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 --max-time 15 "$PREVIEW_URL/" -o /dev/null

  verify-preview:
    needs: check
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Download checked preview artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Verify immutable Preview bytes and browser flows
        env:
          PREVIEW_URL: ${{ needs.check.outputs.preview_url }}
        run: |
          test -n "$PREVIEW_URL"
          npx playwright install --with-deps chromium
          node scripts/verify-preview-deployment.mjs --url="${PREVIEW_URL%/}/" --dist=dist
      - name: Retain exact Preview verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: preview-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: preview-verification.json
          if-no-files-found: error
          retention-days: 14
