name: Deploy

on:
  pull_request:
    branches: [main, production]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore pipeline state
        uses: actions/checkout@v4
        with:
          ref: pipeline-state
          path: pipeline-state
      - name: Restore deploy data
        run: |
          mkdir -p public/data
          cp -f pipeline-state/data/*.json public/data/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Deploy Preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "03d40efd3c60181edea80af8d927ddc1"
          command: pages deploy dist --project-name taiwan-intel-dashboard --branch pr-${{ github.event.number }}
      - name: Comment Preview URL
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            if (url) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🔗 **Preview:** ${url}`
              });
            }
