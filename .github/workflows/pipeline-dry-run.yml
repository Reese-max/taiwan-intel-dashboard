name: 全來源資料管線 Dry Run（不部署）

on:
  workflow_dispatch:
    inputs:
      renorm_intl:
        description: "忽略國際快取、全部重新正規化"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pipeline-live-fetch
  cancel-in-progress: false

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yml
    with:
      mode: refresh
      schedule: ""
      renorm_intl: ${{ inputs.renorm_intl || false }}
      save_state: false
      deploy: false
    secrets: inherit
