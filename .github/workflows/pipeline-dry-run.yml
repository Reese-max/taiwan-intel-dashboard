name: 全來源資料管線 Dry Run（不部署）

on:
  workflow_dispatch:
    inputs:
      renorm_intl:
        description: "忽略國際快取、全部重新正規化"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pipeline-live-fetch
  cancel-in-progress: false

jobs:
  fetch:
    uses: ./.github/workflows/pipeline-fetch.yml
    with:
      mode: refresh
      schedule: ""
      renorm_intl: ${{ inputs.renorm_intl || false }}
    secrets: inherit

  audit:
    needs: fetch
    uses: ./.github/workflows/pipeline-audit.yml
    with:
      publish_dist: false
