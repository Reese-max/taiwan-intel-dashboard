name: 共用資料抓取

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: hourly
      schedule:
        type: string
        default: ""
      renorm_intl:
        type: boolean
        default: false
    outputs:
      fetch_args:
        description: 本輪抓取參數
        value: ${{ jobs.fetch.outputs.fetch_args }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      fetch_args: ${{ steps.mode.outputs.args }}
    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@v4

      - name: 取回獨立狀態庫
        id: state
        uses: actions/checkout@v4
        with:
          ref: pipeline-state
          path: prev-state
        continue-on-error: true

      - name: 首次轉換時取回舊 gh-pages 狀態
        if: steps.state.outcome != 'success'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: legacy-state
        continue-on-error: true

      - name: 還原上一輪狀態
        run: |
          mkdir -p public/data
          if [ -d prev-state/data ]; then
            cp -f prev-state/data/*.json public/data/ 2>/dev/null || true
            echo "已從 pipeline-state 還原 $(find public/data -maxdepth 1 -type f | wc -l) 個狀態檔"
          elif [ -d legacy-state/data ]; then
            cp -f legacy-state/data/*.json public/data/ 2>/dev/null || true
            echo "已從 gh-pages 還原 $(find public/data -maxdepth 1 -type f | wc -l) 個舊狀態檔"
          else
            echo "尚無舊狀態，本輪從零開始"
          fi

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安裝相依
        run: npm ci

      - name: 決定抓取模式
        id: mode
        run: |
          node scripts/ci-fetch-mode.mjs \
            --schedule="${{ inputs.schedule }}" \
            --mode="${{ inputs.mode }}" \
            --github-output="$GITHUB_OUTPUT"

      - name: 抓取即時資料
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          LLM_FALLBACK_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_FALLBACK_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
          LLM_FALLBACK_MODEL: ${{ secrets.NVIDIA_MODEL }}
          SUMMARY_LLM: ${{ secrets.SUMMARY_LLM }}
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_BASE_URL: ${{ secrets.SUMMARY_BASE_URL }}
          SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
          SUMMARY_MAX_CONCURRENCY: ${{ secrets.SUMMARY_MAX_CONCURRENCY }}
          SUMMARY_TIMEOUT_MS: ${{ secrets.SUMMARY_TIMEOUT_MS }}
          SUMMARY_MAX_RETRIES: ${{ secrets.SUMMARY_MAX_RETRIES }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          INTERNATIONAL_FEED_TIER: ${{ steps.mode.outputs.international_feed_tier }}
          INTERNATIONAL_FEED_TOPIC: ${{ steps.mode.outputs.international_feed_topic }}
          INTL_RENORM_ALL: ${{ inputs.renorm_intl }}
          # 冷啟動（快取空白）時 15 分鐘預設預算跑不完全量正規化（2026-08-02 實證：
          # normalizeSkippedBatches=60、general 40/50 不達門檻），停擺 6 週後復原首跑必中。
          INTL_NORMALIZE_BUDGET_MS: "2700000"
          DOMESTIC_NORMALIZE_BUDGET_MS: "1800000"
          NODE_OPTIONS: --use-system-ca
        run: node scripts/fetch-live.mjs ${{ steps.mode.outputs.args }}

      - name: 驗證必要來源已更新
        env:
          ALLOW_STALE_CWA: ${{ vars.ALLOW_STALE_CWA }}
        run: node scripts/assert-pipeline-sources.mjs ${{ steps.mode.outputs.assert_args }}

      - name: 驗證國際正規化結果門檻
        if: contains(steps.mode.outputs.args, 'rss') && steps.mode.outputs.international_feed_tier == 'expanded'
        run: >-
          node scripts/assert-pipeline-sources.mjs
          ${{ steps.mode.outputs.assert_args }}
          --international-output=public/data/international.json
          --international-topic="${{ steps.mode.outputs.international_feed_topic }}"
          --min-official-police-events=20
          --min-official-police-sources=7
          --min-general-events=50
          --min-general-sources=10

      - name: 檢查新聞來源實際貢獻
        if: contains(steps.mode.outputs.args, 'twnews')
        run: npm run audit:news-source-contribution

      - name: 驗收情報網產物契約
        run: npm run check:network-contract

      - name: 保存候選資料 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/data
          retention-days: 7
          if-no-files-found: error
