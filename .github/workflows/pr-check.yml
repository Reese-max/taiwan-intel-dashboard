name: PR 檢查

# PR 進 main 前的輕量閘門：只跑型別檢查、單元測試與 build。
# 不抓即時資料、不用 LLM secrets、不部署 —— 那些由 update-and-deploy.yml 的排程負責。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@v4

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安裝相依
        run: npm ci

      - name: 單元測試
        run: npm test

      # public/data 不進版控；需要候選資料的 build 由 pipeline-audit 在下載 artifact 後執行。
      - name: TypeScript 型別檢查
        run: npx tsc --noEmit
