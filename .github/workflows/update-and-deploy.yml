name: 更新資料並部署

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-and-deploy.yml"
      - ".github/workflows/pipeline-fetch.yml"
      - ".github/workflows/pipeline-audit.yml"
      - "scripts/**"
      - "ops/approved-code.json"
  schedule:
    - cron: "17,47 * * * *" # 每30分鐘 :17/:47 → 全部小時來源
    - cron: "30 18 * * *" # 每日 18:30 UTC ≈ 02:30 台北 → full refresh
  workflow_dispatch:
    inputs:
      mode:
        description: "hourly（含官方來源與補充領域）/ cwa / international-* / cwa-international / twnews / daily / refresh"
        default: hourly
        type: choice
        options: [hourly, cwa, international, international-expanded, international-core, international-general, international-police, international-cyber, international-disaster, international-health, international-humanitarian, international-finance, cwa-international, twnews, daily, refresh, police]
      renorm_intl:
        description: "忽略國際快取、全部重新正規化（一次性，用於套用新風險校準）"
        default: false
        type: boolean

concurrency:
  group: pipeline-live-fetch
  # A reviewed code release supersedes a fetch stuck on older pipeline code.
  # Routine schedules still serialize so data writes cannot race.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  operating-state:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/operating-state.mjs guard-schedule

  fetch:
    needs: operating-state
    permissions:
      contents: read
    uses: ./.github/workflows/pipeline-fetch.yml
    with:
      mode: ${{ inputs.mode || '' }}
      schedule: ${{ github.event.schedule || '' }}
      renorm_intl: ${{ inputs.renorm_intl || false }}
    secrets: inherit

  save-state:
    needs: [fetch, audit, build-approved]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@v4

      - name: 下載候選資料
        uses: actions/download-artifact@v4
        with:
          name: pipeline-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: state/data

      - name: 更新獨立狀態庫
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./state
          publish_branch: pipeline-state
          force_orphan: true
          commit_message: "auto: 更新資料管線狀態"

  audit:
    needs: fetch
    permissions:
      contents: read
    uses: ./.github/workflows/pipeline-audit.yml

  build-approved:
    needs: [fetch, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      approved_sha: ${{ steps.approved.outputs.sha }}
    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@v4

      - name: 讀取核准的網站程式碼版本
        id: approved
        run: node scripts/approved-code.mjs --github-output="$GITHUB_OUTPUT"

      - name: Checkout 核准的網站程式碼
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.approved.outputs.sha }}
          path: approved-site

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: approved-site/package-lock.json

      - name: 安裝核准版本相依
        working-directory: approved-site
        run: npm ci

      - name: 下載已稽核資料
        uses: actions/download-artifact@v4
        with:
          name: pipeline-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: approved-site/public/data

      - name: 驗收核准版本與本輪資料並建置網站
        working-directory: approved-site
        run: npm run check

      - name: 保存核准版本網站
        uses: actions/upload-artifact@v4
        with:
          name: approved-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: approved-site/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [save-state, build-approved]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@v4
        with:
          ref: ${{ needs['build-approved'].outputs.approved_sha }}

      - name: 下載核准版本網站
        uses: actions/download-artifact@v4
        with:
          name: approved-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "03d40efd3c60181edea80af8d927ddc1"
          command: pages deploy dist --project-name=taiwan-intel-dashboard --branch=main

      - name: 部署後線上 smoke
        env:
          DEPLOY_BASE_URL: https://taiwan-intel-dashboard.pages.dev
        run: node scripts/smoke-deployed.mjs

  next-refresh:
    needs: [operating-state, fetch, audit, build-approved, save-state, deploy]
    if: ${{ always() && !cancelled() && needs['operating-state'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 排程延遲時接力觸發下一輪資料更新
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dispatch-next-refresh.mjs

  notify:
    needs: [operating-state, fetch, save-state, audit, build-approved, deploy]
    if: ${{ always() && (failure() || cancelled()) }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: 失敗／取消通知（Telegram；未設 secrets 靜默跳過）
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s -m 15 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="$TG_CHAT" \
              --data-urlencode text="⚠️ taiwan-intel-dashboard run ${{ github.run_id }}（guard=${{ needs['operating-state'].result }}、fetch=${{ needs.fetch.result }}、audit=${{ needs.audit.result }}、build=${{ needs['build-approved'].result }}、state=${{ needs['save-state'].result }}、deploy=${{ needs.deploy.result }}）— https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          else
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID 未設定，跳過通知"
          fi
